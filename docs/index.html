<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Agentic AI Workflows with Embabel</title>

    <link rel="stylesheet" href="./reveal.js/dist/reset.css">
    <link rel="stylesheet" href="./reveal.js/dist/reveal.css">
    <link rel="stylesheet" href="./reveal.js/dist/theme/simple.css">
    <link rel="stylesheet" href="./reveal.js/dist/plugin/highlight/monokai.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --spring-green: #6db33f;
            --spring-green-light: #80ea6e;
            --spring-dark: #191e1e;
            --spring-text: #4a4a4a;
            --spring-heading: #111;
            --spring-border: #ebf2f2;
            --spring-border-medium: #d9e9e9;
            --spring-link: #6db33f;
            --spring-muted: #7a7a7a;
        }

        .reveal {
            font-family: 'Open Sans', BlinkMacSystemFont, -apple-system, sans-serif;
            font-size: 28px;
            color: var(--spring-text);
            line-height: 1.6;
        }
        .reveal h1, .reveal h2, .reveal h3, .reveal h4, .reveal h5 {
            font-family: 'Work Sans', sans-serif;
            color: var(--spring-heading);
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: none;
            margin-bottom: 0.5em;
        }
        .reveal h1 { font-size: 2.2em; line-height: 1.2; }
        .reveal h2 { font-size: 1.5em; line-height: 1.3; margin-bottom: 0.8em; }
        .reveal h3 { font-size: 1.15em; font-weight: 600; margin-bottom: 0.6em; }

        .reveal .slides { border-top: 5px solid var(--spring-green); }

        .reveal a { color: var(--spring-link); text-decoration: underline; }
        .reveal a:hover { color: var(--spring-dark); }

        .reveal pre {
            font-size: 0.55em;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 8px 15px 0 rgba(0,0,0,0.15);
            margin: 1em 0;
        }
        .reveal pre code {
            max-height: 500px;
            padding: 20px 24px;
            word-wrap: break-word;
            white-space: pre-wrap;
            background: var(--spring-dark);
            border-radius: 8px;
        }
        .reveal code {
            font-size: 0.9em;
            color: var(--spring-green);
            padding: 2px 6px;
            background: #f0f4ff;
            border-radius: 3px;
        }

        .reveal ul, .reveal ol { font-size: 0.85em; margin-bottom: 0.8em; }
        .reveal li { margin-bottom: 0.3em; }

        .reveal table { font-size: 0.75em; border-collapse: collapse; margin: 1em auto; }
        .reveal table th {
            background: var(--spring-green);
            color: #fff;
            font-family: 'Work Sans', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.05em;
            padding: 12px 18px;
            border: none;
        }
        .reveal table td {
            padding: 10px 18px;
            border-bottom: 1px solid var(--spring-border);
        }
        .reveal table tr:nth-child(even) td { background: #f9fdf7; }

        .reveal p { font-size: 0.9em; margin-bottom: 0.6em; }
        .reveal section {
            padding: 40px 0px;
            margin: 0 auto;
        }

        .reveal blockquote {
            font-size: 0.9em;
            border-left: 4px solid var(--spring-green);
            background: #f9fdf7;
            padding: 12px 20px;
            border-radius: 0 5px 5px 0;
            box-shadow: none;
            font-style: italic;
            margin: 0.8em 0;
            color: var(--spring-heading);
        }

        .reveal section[data-background-color="#6db33f"] h1,
        .reveal section[data-background-color="#6db33f"] h2,
        .reveal section[data-background-color="#6db33f"] h3,
        .reveal section[data-background-color="#6db33f"] p {
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .reveal section[data-background-color="#6db33f"] a {
            color: #fff;
            text-decoration: underline;
        }
        .reveal section[data-background-color="#191e1e"] h1,
        .reveal section[data-background-color="#191e1e"] h2,
        .reveal section[data-background-color="#191e1e"] h3,
        .reveal section[data-background-color="#191e1e"] p {
            color: #fff;
        }

        .reveal strong { color: var(--spring-heading); font-weight: 700; }
        .reveal .progress { color: var(--spring-green); height: 5px; }
        .reveal .controls { color: var(--spring-green); }
        .reveal .slide-number {
            font-family: 'Work Sans', sans-serif;
            font-size: 14px;
            color: var(--spring-muted);
            background: transparent;
            right: 30px;
            bottom: 30px;
        }

        /* PDF-friendly: remove shadows on print */
        @media print {
            .reveal pre { box-shadow: none; border: 1px solid #ddd; }
            .reveal blockquote { box-shadow: none; }
            .reveal section { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
<div class="reveal">
    <div class="slides">

        <section data-markdown="intro.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="warmer.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="the-challenge.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="enter-embabel.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="spring-beans-as-actions.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="sre-domain.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="goal-oriented.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="dice.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="code-demo.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="why-jvm.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

        <section data-markdown="outro.md"
                 data-separator="^\f"
                 data-separator-vertical="^---"
                 data-separator-notes="^Notes:"
                 data-charset="utf8">
        </section>

    </div>
</div>

<script src="./reveal.js/dist/reveal.js"></script>
<script src="./reveal.js/dist/plugin/markdown.js"></script>
<script src="./reveal.js/dist/plugin/highlight.js"></script>
<script src="./reveal.js/dist/plugin/notes.js"></script>

<script>
    Reveal.initialize({
        controls: true,
        progress: true,
        history: true,
        center: true,
        hash: true,
        slideNumber: true,
        width: 1200,
        height: 800,
        margin: 0.02,
        plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
    });
</script>
</body>
</html>
