spring.application.name=embabel-shell-demo
spring.shell.interactive.enabled=true
spring.shell.prompt.text=embabel>
spring.shell.prompt.color=GREEN
spring.shell.title=🤖 Embabel Shell Demo - Agentic AI on the JVM

# This is a shell application. Spring AI's RestClient works without an embedded web server.
spring.main.web-application-type=none

# Redis Stack in compose.yml
spring.data.redis.host=localhost
spring.data.redis.port=6379

logging.level.root=INFO
logging.level.io.embabel=DEBUG
logging.level.com.embabel.demo=DEBUG
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.boot.autoconfigure=INFO

# Ollama LLM Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=qwen2.5-coder:1.5b
spring.ai.ollama.chat.options.temperature=0.7

# CPU inference can take longer than the default client response window.
embabel.ollama.request-timeout=300s

# Embabel 1.5 model configuration: discover models from Ollama and use qwen2.5-coder by default
embabel.agent.platform.models.ollama.base-url=${spring.ai.ollama.base-url}
embabel.models.default-llm=qwen2.5-coder:1.5b

# Spring AI TypeSafe: Jev (hosted System One) checks the LLM's recommendation against the runbook.
# Optional: EmbabelShellDemoApplication maps TYPESAFE_API_KEY to spring.ai.typesafe.api-key only
# when it is set; without it the check is skipped. Base URL and model default to
# https://api.typesafe.ai and jev-latest.
# Below this probability the incident is escalated. Uncalibrated: tune it against real Jev answers.
demo.runbook-check.threshold=0.7
